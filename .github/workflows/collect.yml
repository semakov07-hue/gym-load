yaml
name: collect

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Measure
        run: python collector.py
        env:
          FITNESS_TOKEN: ${{ secrets.FITNESS_TOKEN }}
          GYM_TZ: Asia/Yekaterinburg

      - name: Save data
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/occupancy.csv
          git diff --cached --quiet || (git commit -m "new measurement" && git pull --rebase && git push)
